<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Norie personalized hair accessories lookbook.">
    <title>Norie | Lookbooks</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #4d4850;
        --line: rgba(191, 111, 135, 0.46);
        --paper: #fffdfb;
        --pink: #b65f7d;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        background: var(--paper);
        color: var(--ink);
        font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
        margin: 0;
      }

      a {
        color: inherit;
      }

      a:focus-visible,
      button:focus-visible {
        outline: 3px solid #7d2949;
        outline-offset: 4px;
      }

      .site-header {
        background: rgba(255, 253, 251, 0.96);
        border-bottom: 1px solid var(--line);
        position: relative;
        z-index: 10;
      }

      .nav {
        align-items: center;
        display: grid;
        gap: 1rem;
        grid-template-columns: 1fr auto 1fr;
        margin: 0 auto;
        max-width: 1240px;
        min-height: 7rem;
        padding: 1rem clamp(1rem, 4vw, 2rem);
      }

      .language-switcher {
        align-items: center;
        display: flex;
        gap: 0.35rem;
        justify-self: start;
      }

      .language-switcher button {
        background: transparent;
        border: 0;
        color: var(--ink);
        cursor: pointer;
        font: inherit;
        min-height: 2.75rem;
        min-width: 2.75rem;
        padding: 0.5rem;
      }

      .language-switcher button[aria-pressed="true"] {
        color: #7d2949;
        font-weight: 700;
        text-decoration: underline;
        text-underline-offset: 0.25rem;
      }

      .brand-logo {
        align-items: center;
        display: inline-flex;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.2rem, 5vw, 3.5rem);
        gap: 0.2rem;
        justify-self: center;
        line-height: 1;
        text-decoration: none;
      }

      .brand-heart {
        color: var(--pink);
        font-size: 0.42em;
      }

      .cart-link {
        height: 2.75rem;
        justify-self: end;
        padding: 0.55rem;
        width: 2.75rem;
      }

      .cart-link svg {
        height: 100%;
        width: 100%;
      }

      .nav-list {
        display: flex;
        flex-wrap: wrap;
        gap: clamp(0.8rem, 3vw, 2.25rem);
        grid-column: 1 / -1;
        justify-content: center;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .nav-list a {
        display: inline-block;
        font-size: 0.78rem;
        letter-spacing: 0.13em;
        min-height: 2.75rem;
        padding: 0.85rem 0.2rem;
        text-decoration: none;
        text-transform: uppercase;
      }

      .nav-list a:hover,
      .nav-list a[aria-current="page"] {
        color: #7d2949;
        text-decoration: underline;
        text-underline-offset: 0.4rem;
      }

      main {
        margin: 0 auto;
        max-width: 1240px;
        padding: clamp(3rem, 8vw, 6rem) clamp(1rem, 4vw, 2rem);
      }

      h1 {
        font-size: clamp(1.15rem, 2vw, 1.5rem);
        font-weight: 500;
        letter-spacing: 0.16em;
        margin: 0 0 clamp(1.5rem, 4vw, 2.5rem);
        text-align: center;
      }

      .lookbooks-grid {
        display: grid;
        gap: clamp(0.65rem, 1.5vw, 1.1rem);
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .lookbooks-photo {
        aspect-ratio: 3 / 4;
        display: block;
        height: 100%;
        object-fit: cover;
        width: 100%;
      }

      .site-footer {
        border-top: 1px solid var(--line);
        padding: 2rem clamp(1rem, 4vw, 2rem);
      }

      .footer-inner {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 1rem 2rem;
        justify-content: space-between;
        margin: 0 auto;
        max-width: 1240px;
      }

      .footer-links {
        display: flex;
        flex-wrap: wrap;
        gap: 1.25rem;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      @media (max-width: 700px) {
        .nav {
          min-height: auto;
        }

        .nav-list {
          gap: 0.5rem 1rem;
        }

        .lookbooks-grid {
          grid-template-columns: 1fr;
        }

        .footer-inner {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body data-page="lookbooks">
    <header class="site-header">
      <nav class="nav" aria-label="Main">
        <div class="language-switcher" data-language-switcher role="group" aria-label="Language">
          <button type="button" data-locale="en" aria-pressed="true">EN</button>
          <span aria-hidden="true">/</span>
          <button type="button" data-locale="zh-CN" aria-pressed="false">中文</button>
        </div>
        <a class="brand-logo" href="index.html" aria-label="Norie homepage">
          <span>Norie</span>
          <span class="brand-heart" aria-hidden="true">♥</span>
        </a>
        <a class="cart-link" href="cart.html">
          <span class="visually-hidden" data-cart-label>Cart, empty</span><span class="cart-count" data-cart-count hidden>0</span>
          <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M6.5 8.5h11l.8 11H5.7l.8-11Z"></path>
            <path d="M9 8.5V7a3 3 0 0 1 6 0v1.5"></path>
          </svg>
        </a>
        <ul class="nav-list">
          <li><a href="index.html">Homepage</a></li>
          <li><a href="shop.html">Shop</a></li>
          <li><a href="customize.html">Customize</a></li>
          <li><a href="lookbooks.html" data-i18n="nav.lookbooks" aria-current="page">LOOKBOOKS</a></li>
        </ul>
      </nav>
    </header>

    <main id="main">
      <h1 data-i18n="home.lookbooks.title">LOOKBOOKS</h1>
      <div class="lookbooks-grid">
        <img class="lookbooks-photo" src="assets/lookbooks-pink-scrunchie.jpg" alt="Pink satin scrunchie styled in a ponytail with Norie accessories" loading="lazy">
        <img class="lookbooks-photo" src="assets/lookbooks-white-claw-bag.jpg" alt="White personalized claw clip styled on a cream shoulder bag" loading="lazy">
        <img class="lookbooks-photo" src="assets/lookbooks-white-hair-clip.jpg" alt="White personalized claw clip styled in a ponytail" loading="lazy">
        <img class="lookbooks-photo" src="assets/lookbooks-pink-brush-walk.jpg" alt="Pink personalized hair brush held during a city walk" loading="lazy">
        <img class="lookbooks-photo" src="assets/lookbooks-pink-claw-street.jpg" alt="Pink claw clip styled in long hair on a city bench" loading="lazy">
        <img class="lookbooks-photo" src="assets/lookbooks-pink-brush-detail.jpg" alt="Pink personalized hair brush styled with a vanity case and scrunchie" loading="lazy">
        <img class="lookbooks-photo" src="assets/lookbooks-pink-flower-clips.jpg" alt="Pink flower clips styled through long dark hair" loading="lazy">
        <img class="lookbooks-photo" src="assets/lookbooks-white-heart-claw.jpg" alt="White heart claw clip styled in long dark hair" loading="lazy">
        <img class="lookbooks-photo" src="assets/lookbooks-pink-heart-claw.jpg" alt="Pink heart claw clip styled in long dark hair" loading="lazy">
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <p>© 2026 Norie</p>
        <ul class="footer-links">
          <li><a href="shop.html">Shop</a></li>
          <li><a href="customize.html">Customize</a></li>
          <li><a href="index.html#contact">Contact</a></li>
        </ul>
      </div>
    </footer>
    <script type="module" src="norie-i18n.js"></script>
    <script type="module" src="norie-cart.js"></script>
  </body>
</html>
