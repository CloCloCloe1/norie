<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Norie | Cart</title>
    <style>
      :root { --cream:#fff9f7; --white:#fff; --berry:#64243a; --ink:#39222d; --soft:#6b4d59; --line:#bf6f87; --focus:#1557b0; }
      * { box-sizing:border-box; }
      body { margin:0; background:var(--cream); color:var(--ink); font-family:Inter,"Helvetica Neue",Arial,sans-serif; line-height:1.5; }
      a { color:inherit; text-underline-offset:.2em; }
      a:focus-visible, button:focus-visible, input:focus-visible { outline:3px solid var(--focus); outline-offset:3px; }
      .visually-hidden { border:0; clip:rect(0 0 0 0); height:1px; margin:-1px; overflow:hidden; padding:0; position:absolute; white-space:nowrap; width:1px; }
      .site-header { background:rgba(255,255,255,.96); border-bottom:1px solid rgba(191,111,135,.72); position:sticky; top:0; z-index:10; }
      .nav { align-items:center; display:grid; grid-template-columns:1fr auto 1fr; margin:auto; max-width:1180px; padding:1rem clamp(1rem,4vw,2rem); }
      .language-switcher { align-items:center; display:flex; gap:.35rem; grid-column:1; justify-self:start; }
      .language-switcher button { background:transparent; border:0; color:var(--soft); font-size:.78rem; font-weight:700; min-height:44px; min-width:44px; padding:.25rem; }
      .language-switcher button[aria-pressed="true"] { color:var(--berry); text-decoration:underline; text-underline-offset:.3em; }
      .brand-logo { color:#1f1d20; font-size:1.7rem; font-weight:700; grid-column:2; letter-spacing:.32em; text-decoration:none; }
      .cart-link { align-items:center; display:inline-flex; grid-column:3; justify-self:end; min-height:44px; min-width:44px; position:relative; text-decoration:none; }
      .cart-link svg { height:28px; width:28px; }
      .cart-count { align-items:center; background:var(--berry); border-radius:999px; color:#fff; display:flex; font-size:.68rem; font-weight:800; height:1.25rem; justify-content:center; position:absolute; right:-.25rem; top:0; width:1.25rem; }
      main { display:grid; gap:2rem; grid-template-columns:minmax(0,1.35fr) minmax(18rem,.65fr); margin:auto; max-width:1180px; padding:clamp(2rem,6vw,5rem) clamp(1rem,4vw,2rem); }
      h1,h2 { color:var(--berry); font-family:Georgia,"Times New Roman",serif; font-weight:400; margin:0 0 1rem; }
      h1 { font-size:clamp(2.6rem,7vw,5rem); } h2 { font-size:2rem; }
      .cart-section,.checkout-section { min-width:0; }
      .cart-line,.checkout-section { background:var(--white); border:1px solid rgba(191,111,135,.72); padding:1rem; }
      .cart-line { display:grid; gap:.75rem; grid-template-columns:1fr auto; margin-bottom:.75rem; }
      .cart-line h2 { font-size:1.3rem; margin:0; }
      .cart-line p { color:var(--soft); margin:.2rem 0; }
      .quantity { align-items:center; display:flex; gap:.65rem; }
      button { background:var(--white); border:1px solid var(--berry); color:var(--berry); cursor:pointer; min-height:44px; min-width:44px; }
      .remove { grid-column:1/-1; justify-self:start; padding:0 .9rem; }
      .cart-total { color:var(--berry); display:flex; font-size:1.2rem; justify-content:space-between; padding:1rem 0; }
      form { display:grid; gap:.45rem; }
      label { font-weight:700; margin-top:.6rem; }
      input { border:1px solid var(--line); min-height:46px; padding:.65rem; width:100%; }
      form button { background:var(--berry); color:#fff; font-weight:800; margin-top:1rem; padding:.75rem; }
      #checkoutStatus:not(:empty) { margin-top:.75rem; }
      @media (max-width:760px) { main { grid-template-columns:1fr; } }
    </style>
  </head>
  <body>
    <header class="site-header"><nav class="nav" aria-label="Main"><div class="language-switcher" data-language-switcher role="group" aria-label="Language"><button type="button" data-locale="en" aria-pressed="true">EN</button><span aria-hidden="true">/</span><button type="button" data-locale="zh-CN" aria-pressed="false">中文</button></div><a class="brand-logo" href="index.html">Norie</a><a class="cart-link" href="cart.html" aria-label="Cart, empty" aria-current="page"><span class="cart-count" data-cart-count hidden>0</span><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6.5 8.5h11l.8 11H5.7l.8-11Z"></path><path d="M9 8.5V7a3 3 0 0 1 6 0v1.5"></path></svg></a></nav></header>
    <main id="main">
      <section class="cart-section" aria-labelledby="cart-title">
        <h1 id="cart-title" data-i18n="cart.title">Your cart</h1>
        <p data-cart-empty hidden><span data-i18n="cart.empty">Your cart is empty.</span> <a href="shop.html" data-i18n="cart.shop">Continue shopping</a></p>
        <div data-cart-lines></div>
        <div class="cart-total"><span data-i18n="cart.total">Total</span> <strong data-cart-total>CAD $0</strong></div>
      </section>
      <section class="checkout-section" aria-labelledby="checkout-title" data-checkout>
        <h2 id="checkout-title" data-i18n="checkout.title">Checkout</h2>
        <form id="checkoutForm" novalidate>
          <label for="checkoutName" data-i18n="checkout.name">Name</label><input id="checkoutName" name="name" autocomplete="name" required>
          <label for="checkoutEmail" data-i18n="checkout.email">Email</label><input id="checkoutEmail" name="email" type="email" autocomplete="email" required>
          <label for="checkoutContact" data-i18n="checkout.contact">Phone or WeChat</label><input id="checkoutContact" name="contact" autocomplete="tel" required>
          <div id="checkoutStatus" role="status" aria-live="polite" tabindex="-1"></div>
          <button type="submit" data-i18n="checkout.submit">Confirm order</button>
        </form>
      </section>
    </main>
    <script type="module" src="norie-i18n.js"></script>
    <script type="module" src="norie-cart.js"></script>
    <script type="module">
      import { cartTotal, createCartStore, deriveStoneColor, lineKey, productCatalog, removeLine, setQuantity } from "./norie-cart.js";

      const store = createCartStore();
      const linesRoot = document.querySelector("[data-cart-lines]");
      const empty = document.querySelector("[data-cart-empty]");
      const total = document.querySelector("[data-cart-total]");
      const checkout = document.querySelector("[data-checkout]");
      const form = document.querySelector("#checkoutForm");
      const status = document.querySelector("#checkoutStatus");

      function render() {
        const cart = store.read();
        linesRoot.replaceChildren();
        empty.hidden = cart.length > 0;
        checkout.hidden = cart.length === 0 && !status.textContent;
        total.textContent = `CAD $${cartTotal(cart)}`;

        cart.forEach((line) => {
          const product = productCatalog[line.productId];
          const article = document.createElement("article");
          article.className = "cart-line";
          const copy = document.createElement("div");
          const title = document.createElement("h2");
          title.textContent = product.name;
          const details = document.createElement("p");
          const detailParts = [line.baseColor];
          if (product.customizable) detailParts.push(line.customText || "No custom text", deriveStoneColor(line.baseColor));
          details.textContent = detailParts.join(" · ");
          const price = document.createElement("strong");
          price.textContent = `CAD $${product.launchPrice * line.quantity}`;
          copy.append(title, details, price);

          const quantity = document.createElement("div");
          quantity.className = "quantity";
          const down = document.createElement("button");
          down.type = "button";
          down.textContent = "−";
          down.setAttribute("aria-label", `Decrease ${product.name} quantity`);
          const value = document.createElement("span");
          value.textContent = String(line.quantity);
          const up = document.createElement("button");
          up.type = "button";
          up.textContent = "+";
          up.setAttribute("aria-label", `Increase ${product.name} quantity`);
          down.addEventListener("click", () => { store.write(setQuantity(store.read(), lineKey(line), line.quantity - 1)); render(); });
          up.addEventListener("click", () => { store.write(setQuantity(store.read(), lineKey(line), line.quantity + 1)); render(); });
          quantity.append(down, value, up);

          const remove = document.createElement("button");
          remove.type = "button";
          remove.className = "remove";
          remove.textContent = "Remove";
          remove.setAttribute("aria-label", `Remove ${product.name}`);
          remove.addEventListener("click", () => { store.write(removeLine(store.read(), lineKey(line))); render(); document.querySelector(".cart-line button, #cart-title")?.focus(); });
          article.append(copy, quantity, remove);
          linesRoot.append(article);
        });
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const cart = store.read();
        if (!cart.length) return render();
        if (!form.reportValidity()) return;
        const button = form.querySelector("button[type='submit']");
        const data = new FormData(form);
        button.disabled = true;
        status.textContent = "Sending your order…";
        try {
          const response = await fetch("/api/cart-order", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              customerName: data.get("name"),
              customerEmail: data.get("email"),
              customerContact: data.get("contact"),
              attemptId: crypto.randomUUID(),
              pageUrl: location.href,
              lines: cart
            })
          });
          const result = await response.json();
          if (!response.ok || !result.ok) throw new Error(result.error || "Could not send order");
          store.clear();
          form.reset();
          render();
          status.textContent = `${result.status} · ${result.orderReference} · ${result.total}`;
        } catch {
          status.textContent = "We could not send your order. Your cart is saved; please try again.";
          status.focus();
        } finally {
          button.disabled = false;
        }
      });

      render();
    </script>
  </body>
</html>
